<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#c8102e" />
  <title>Ali Baba · Прямой заказ</title>
  <link rel="manifest" href="manifest.json" />
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <header class="topbar">
    <div class="brand" id="brandName">Ali Baba</div>
    <div class="topbar-actions">
      <button class="link-btn" id="myOrdersBtn" hidden>Мои заказы</button>
      <button class="cart-btn" id="cartBtn" aria-label="Корзина" hidden>
        🛒 <span class="badge" id="cartCount">0</span>
      </button>
    </div>
  </header>

  <!-- ═══ Экран магазина ═══ -->
  <main class="wrap" id="shopView">
    <section class="doors">
      <button class="door door-primary" id="doorSelf">
        <div class="door-emoji">🍽️</div>
        <div class="door-title">Заказать самому</div>
        <div class="door-sub">Меню и повтор прошлого заказа</div>
      </button>
      <a class="door door-secondary" id="doorAdmin" target="_blank" rel="noopener">
        <div class="door-emoji">💬</div>
        <div class="door-title">Связаться с админом</div>
        <div class="door-sub">Крупный / нестандартный заказ</div>
      </a>
    </section>

    <section class="card reorder" id="reorderCard">
      <h2>Повторить прошлый заказ</h2>
      <div class="row">
        <input id="reorderPhone" type="tel" inputmode="tel" placeholder="Ваш телефон, напр. +998 90 123 45 67" />
        <button class="btn" id="reorderBtn">Найти</button>
      </div>
      <div id="reorderResult" class="reorder-result"></div>
    </section>

    <!-- Поиск + категории -->
    <div class="menu-tools" id="menuTools" hidden>
      <input id="menuSearch" type="search" placeholder="🔎 Поиск по меню…" />
      <div class="chips" id="catChips"></div>
    </div>

    <section id="menu" class="menu" aria-live="polite">
      <div class="menu-loading">Загружаем меню…</div>
    </section>
  </main>

  <!-- ═══ Экран «Мои заказы» ═══ -->
  <main class="wrap" id="ordersView" hidden>
    <h2 class="view-title">Мои заказы</h2>
    <div class="row" style="margin-bottom:12px">
      <input id="ordersPhone" type="tel" inputmode="tel" placeholder="Телефон для поиска" />
      <button class="btn" id="ordersFindBtn">Показать</button>
    </div>
    <div id="ordersList"></div>
    <button class="btn btn-ghost" id="ordersBack">← В меню</button>
  </main>

  <!-- ═══ Экран статуса / подтверждения ═══ -->
  <main class="wrap status-wrap" id="statusView" hidden>
    <div class="status-card" id="statusCard"></div>
    <button class="btn btn-ghost" id="backToShop">← Вернуться в меню</button>
  </main>

  <!-- Липкая нижняя панель корзины -->
  <div class="cartbar" id="cartBar" hidden>
    <div class="cartbar-info">
      <span id="cartBarCount">0 позиций</span>
      <b id="cartBarTotal">0 сум</b>
    </div>
    <button class="btn" id="cartBarBtn">Оформить →</button>
  </div>

  <!-- Корзина / оформление -->
  <div class="sheet-backdrop" id="sheetBackdrop" hidden></div>
  <aside class="sheet" id="cartSheet" hidden aria-label="Корзина">
    <div class="sheet-head">
      <h2>Ваш заказ</h2>
      <button class="icon-btn" id="closeCart" aria-label="Закрыть">✕</button>
    </div>
    <div id="cartItems" class="cart-items"></div>

    <form id="checkoutForm" class="checkout" novalidate>
      <div class="seg">
        <label><input type="radio" name="segment" value="retail" checked /> Частное лицо</label>
        <label><input type="radio" name="segment" value="corp" /> Компания</label>
      </div>
      <input name="client_name" placeholder="Имя *" required autocomplete="name" />
      <input name="company" placeholder="Компания (для юрлиц)" autocomplete="organization" />
      <input name="phone" type="tel" inputmode="tel" placeholder="Телефон *" required autocomplete="tel" />

      <div class="ful">
        <label><input type="radio" name="fulfillment" value="delivery" checked /> 🛵 Доставка</label>
        <label><input type="radio" name="fulfillment" value="pickup" /> 🏃 Самовывоз</label>
      </div>

      <select name="delivery_zone" id="zoneSelect"></select>
      <select name="delivery_time" id="timeSlot"></select>
      <input name="address" id="addressField" placeholder="Адрес доставки" autocomplete="street-address" />
      <textarea name="note" placeholder="Комментарий к заказу" rows="2"></textarea>

      <!-- Итоги -->
      <div class="totals" id="totals"></div>
      <div class="min-warn" id="minWarn" hidden></div>

      <div class="pay">
        <label><input type="radio" name="payment_method" value="card" checked /> 💳 Картой онлайн</label>
        <label><input type="radio" name="payment_method" value="invoice" /> 🧾 Счёт / перечисление</label>
      </div>

      <button type="submit" class="btn btn-lg" id="submitBtn">Отправить заказ</button>
      <div id="formMsg" class="form-msg"></div>
    </form>
  </aside>

  <script src="config.js"></script>
  <script src="app.js"></script>
</body>
</html>
